
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="clockstyle.css">
</head>
<body>

    <div class="clock-container">
        <div class="clock-card">

            <p class="status">● LIVE DIGITAL CLOCK</p>

            <h1>Current Time</h1>

            <div class="time-display">
                <span id="hours">00</span> :
                <span id="minutes">00</span> :
                <span id="seconds">00</span>
                <span id="ampm">AM</span>
            </div>

            <div class="date-display">
                <span id="day">Monday</span>
                |
                <span id="date">01 January 2026</span>
            </div>

            <div class="footer">
                <span>Real-time clock</span>
                <span>Updated every second</span>
            </div>

        </div>
    </div>

    <script src="clockscript.js"></script>
</body>
</html>
